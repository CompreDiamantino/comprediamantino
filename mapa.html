<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>Mapa do Comércio — Compre Diamantino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2A6B',
                        secondary: '#F5C518',
                        accent: '#0D3B8C'
                    }
                }
            }
        }
    </script>
    <style>
        #mapaGeral { height: 420px; border-radius: 16px; width: 100%; z-index: 0; }
        @media (max-width: 768px) { #mapaGeral { height: 340px; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-primary text-white sticky top-0 z-40 shadow">
        <div class="container mx-auto px-4 flex items-center justify-between h-14">
            <a href="index.html" class="flex items-center gap-2">
                <img src="icon-192.png" alt="Logo" class="w-8 h-8 rounded-full">
                <span class="font-bold text-sm">Compre Diamantino</span>
            </a>
            <a href="index.html" class="text-sm hover:text-secondary"><i class="fas fa-arrow-left mr-1"></i> Voltar</a>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-primary">Mapa do comércio</h1>
            <p class="text-gray-500 text-sm mt-1">Todos os anunciantes ativos em Diamantino. Clique no pin para detalhes e “Como chegar”.</p>
        </div>

        <div class="flex flex-wrap gap-2 mb-4">
            <button type="button" id="btnLocalizar" class="bg-primary text-white text-sm font-bold px-4 py-2 rounded-xl hover:bg-accent transition">
                <i class="fas fa-location-arrow mr-1"></i> Usar minha localização
            </button>
            <span id="infoLoc" class="text-sm text-gray-500 self-center"></span>
        </div>

        <div id="mapaGeral" class="bg-gray-200 shadow-md mb-6"></div>
        <p id="mapaErro" class="hidden text-sm text-red-600 mb-4"></p>

        <div id="resultadoProxima" class="hidden mb-4 text-sm text-primary font-semibold bg-blue-50 border border-blue-100 rounded-xl px-4 py-3"></div>

        <h2 class="font-bold text-primary mb-3">Lista rápida</h2>
        <div id="listaEmpresas" class="space-y-3"></div>
    </div>

    <script src="maps-config.js"></script>
    <script src="empresas-dados.js"></script>
    <script>
        var mapa = null;
        var marcadores = [];
        var marcadorUser = null;
        var posicaoUsuario = null;
        var infoWindow = null;

        function listaParaMapa() {
            var byId = {};
            try {
                if (window.EmpresasDados && EmpresasDados.seedSeVazio) EmpresasDados.seedSeVazio();
                var base = (EmpresasDados && EmpresasDados.empresasNoMapa) ? EmpresasDados.empresasNoMapa() : [];
                base.forEach(function (e) { if (e && e.id) byId[String(e.id)] = e; });
            } catch (err) {}
            try {
                ['cd_lojistas_admin', 'cd_lojistas'].forEach(function (key) {
                    var lista = JSON.parse(localStorage.getItem(key) || '[]');
                    if (!Array.isArray(lista)) return;
                    lista.forEach(function (lj) {
                        if (!lj || !lj.id || !lj.nome) return;
                        var st = String(lj.status || '').toLowerCase();
                        if (st === 'removido' || st === 'bloqueado') return;
                        var ok = (st === 'ativo' || st === 'aviso' || st === 'pago' || st === 'aprovado' ||
                            lj.indicada || lj.cadastroIncompleto || lj.origemGoogle || !st);
                        if (!ok && st === 'vencido' && (lj.indicada || lj.origemGoogle)) ok = true;
                        if (!ok) return;
                        var lat = lj.lat, lng = lj.lng;
                        if ((lat == null || lng == null) && lj.mapsLink && EmpresasDados && EmpresasDados.extrairCoords) {
                            var c = EmpresasDados.extrairCoords(lj.mapsLink);
                            if (c) { lat = c.lat; lng = c.lng; }
                        }
                        if (lat == null || lng == null) return;
                        byId[String(lj.id)] = Object.assign({}, byId[String(lj.id)] || {}, {
                            id: lj.id,
                            nome: lj.nome,
                            categoria: lj.categoria || '',
                            endereco: lj.endereco || '',
                            whatsapp: lj.whatsapp || '',
                            lat: Number(lat),
                            lng: Number(lng),
                            status: lj.status || 'ativo'
                        });
                    });
                });
            } catch (e2) {}
            return Object.keys(byId).map(function (k) { return byId[k]; });
        }

        function renderLista(empresas) {
            var box = document.getElementById('listaEmpresas');
            if (!box) return;
            if (!empresas.length) {
                box.innerHTML = '<p class="text-gray-400 text-sm">Nenhuma empresa ativa no mapa ainda.</p>';
                return;
            }
            box.innerHTML = empresas.map(function (e) {
                var dir = (EmpresasDados && EmpresasDados.linkComoChegar)
                    ? EmpresasDados.linkComoChegar(e.lat, e.lng, posicaoUsuario)
                    : ('https://www.google.com/maps/dir/?api=1&destination=' + e.lat + ',' + e.lng);
                var dist = e.distanciaTexto
                    ? '<span class="text-secondary text-xs font-semibold"><i class="fas fa-location-arrow"></i> ' + e.distanciaTexto + '</span>'
                    : '';
                return (
                    '<div class="bg-white border border-gray-100 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">' +
                    '<div><p class="font-bold text-gray-900">' + (e.nome || '') + '</p>' +
                    '<p class="text-xs text-gray-500">' + (e.categoria || '') + ' · ' + (e.endereco || '') + '</p>' + dist + '</div>' +
                    '<div class="flex flex-wrap gap-2">' +
                    '<a href="empresa.html?id=' + encodeURIComponent(e.id) + '" class="text-xs bg-primary text-white px-3 py-1.5 rounded-lg font-semibold">Ver empresa</a>' +
                    '<a href="' + dir + '" target="_blank" rel="noopener" class="text-xs bg-secondary text-primary px-3 py-1.5 rounded-lg font-semibold">Como chegar</a>' +
                    (e.whatsapp ? '<a href="https://wa.me/55' + String(e.whatsapp).replace(/\\D/g, '') + '" target="_blank" class="text-xs bg-green-500 text-white px-3 py-1.5 rounded-lg font-semibold"><i class="fab fa-whatsapp"></i></a>' : '') +
                    '</div></div>'
                );
            }).join('');
        }

        function montarMarcadores(empresas) {
            marcadores.forEach(function (m) { try { m.setMap(null); } catch (e) {} });
            marcadores = [];
            if (!mapa || typeof google === 'undefined') return;
            if (!infoWindow) infoWindow = new google.maps.InfoWindow();
            var bounds = new google.maps.LatLngBounds();
            var n = 0;
            empresas.forEach(function (e) {
                var lat = Number(e.lat), lng = Number(e.lng);
                if (isNaN(lat) || isNaN(lng)) return;
                var pos = { lat: lat, lng: lng };
                var marker = new google.maps.Marker({
                    position: pos,
                    map: mapa,
                    title: e.nome || '',
                    icon: {
                        url: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
                        scaledSize: new google.maps.Size(32, 32)
                    }
                });
                var dir = (EmpresasDados && EmpresasDados.linkComoChegar)
                    ? EmpresasDados.linkComoChegar(lat, lng, posicaoUsuario)
                    : ('https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng);
                marker.addListener('click', function () {
                    infoWindow.setContent(
                        '<div style="min-width:180px;font-family:sans-serif;padding:2px">' +
                        '<strong style="color:#0A2A6B">' + (e.nome || '') + '</strong><br>' +
                        '<span style="color:#555;font-size:12px">' + (e.endereco || '') + '</span><br>' +
                        '<a href="empresa.html?id=' + encodeURIComponent(e.id) + '" style="font-size:12px;color:#0A2A6B">Ver empresa</a> · ' +
                        '<a href="' + dir + '" target="_blank" style="font-size:12px;color:#0A2A6B">Como chegar</a></div>'
                    );
                    infoWindow.open(mapa, marker);
                });
                marcadores.push(marker);
                bounds.extend(pos);
                n++;
            });
            if (n === 1) mapa.setCenter(bounds.getCenter()), mapa.setZoom(16);
            else if (n > 1) mapa.fitBounds(bounds, 48);
        }

        function aplicarDistancias(empresas) {
            if (!posicaoUsuario || !EmpresasDados) return empresas;
            return empresas.map(function (e) {
                var km = EmpresasDados.distanciaKm(posicaoUsuario.lat, posicaoUsuario.lng, e.lat, e.lng);
                var distanciaTexto = km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km';
                return Object.assign({}, e, { distanciaTexto: distanciaTexto, _km: km });
            }).sort(function (a, b) { return a._km - b._km; });
        }

        function atualizarTudo() {
            var empresas = aplicarDistancias(listaParaMapa());
            montarMarcadores(empresas);
            renderLista(empresas);
        }

        function mostrarErroMapa(msg) {
            var el = document.getElementById('mapaErro');
            if (el) { el.textContent = msg; el.classList.remove('hidden'); }
            renderLista(listaParaMapa());
        }

        function initMapaGeral() {
            var el = document.getElementById('mapaGeral');
            if (!el) return;
            if (typeof google === 'undefined' || !google.maps) {
                mostrarErroMapa('Google Maps não carregou. Confira a chave e o faturamento no Google Cloud (projeto Compre Diamantino).');
                return;
            }
            var center = (window.CD_MAPS_CENTER) || (window.EmpresasDados && EmpresasDados.CENTER) || { lat: -14.4089, lng: -56.4458 };
            mapa = new google.maps.Map(el, {
                zoom: 14,
                center: center,
                mapTypeControl: true,
                streetViewControl: false,
                fullscreenControl: true
            });
            atualizarTudo();
        }

        window.onGoogleMapsReady = function () {
            initMapaGeral();
        };
        window.gm_authFailure = function () {
            mostrarErroMapa('Google Maps bloqueado (chave, domínio ou faturamento). No Cloud: Billing + Maps JavaScript API + restrição de HTTP referrer do site.');
        };

        document.getElementById('btnLocalizar').addEventListener('click', function () {
            var info = document.getElementById('infoLoc');
            var res = document.getElementById('resultadoProxima');
            if (!navigator.geolocation) { info.textContent = 'Geolocalização não suportada.'; return; }
            info.textContent = 'Obtendo localização…';
            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    posicaoUsuario = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    info.textContent = 'Localização ativada';
                    if (mapa && google && google.maps) {
                        if (marcadorUser) marcadorUser.setMap(null);
                        marcadorUser = new google.maps.Marker({
                            position: posicaoUsuario,
                            map: mapa,
                            title: 'Você está aqui',
                            icon: {
                                url: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png',
                                scaledSize: new google.maps.Size(32, 32)
                            }
                        });
                        mapa.setCenter(posicaoUsuario);
                        mapa.setZoom(15);
                    }
                    var empresas = aplicarDistancias(listaParaMapa());
                    atualizarTudo();
                    if (empresas.length && res) {
                        res.classList.remove('hidden');
                        res.innerHTML = '<strong>Mais perto de você:</strong> ' + empresas[0].nome + ' (' + empresas[0].distanciaTexto + ')';
                    }
                },
                function () { info.textContent = 'Não foi possível obter o GPS.'; },
                { enableHighAccuracy: true, timeout: 15000 }
            );
        });
    </script>
    <script>
        (function () {
            var key = (window.CD_MAPS_KEY || '').trim();
            if (!key) {
                document.addEventListener('DOMContentLoaded', function () {
                    var el = document.getElementById('mapaErro');
                    if (el) { el.textContent = 'Chave Google Maps não configurada em maps-config.js'; el.classList.remove('hidden'); }
                });
                return;
            }
            var s = document.createElement('script');
            s.async = true;
            s.defer = true;
            s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) +
                '&language=pt-BR&region=BR&callback=onGoogleMapsReady';
            s.onerror = function () {
                var el = document.getElementById('mapaErro');
                if (el) { el.textContent = 'Falha ao carregar script do Google Maps.'; el.classList.remove('hidden'); }
            };
            document.head.appendChild(s);
        })();
    </script>
    <script src="auth-utils.js"></script>
    <script src="install-app.js"></script>
</body>
</html>
