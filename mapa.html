<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>Mapa do Comércio — Compre Diamantino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2A6B',
                        secondary: '#F5C518',
                        accent: '#0D3B8C'
                    }
                }
            }
        }
    </script>
    <style>
        #mapaGeral { height: 420px; border-radius: 16px; width: 100%; z-index: 0; }
        @media (max-width: 768px) { #mapaGeral { height: 340px; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-primary text-white sticky top-0 z-40 shadow">
        <div class="container mx-auto px-4 flex items-center justify-between h-14">
            <a href="index.html" class="flex items-center gap-2">
                <img src="icon-192.png" alt="Logo" class="w-8 h-8 rounded-full">
                <span class="font-bold text-sm">Compre Diamantino</span>
            </a>
            <a href="index.html" class="text-sm hover:text-secondary"><i class="fas fa-arrow-left mr-1"></i> Voltar</a>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-primary">Mapa do comércio</h1>
            <p class="text-gray-500 text-sm mt-1">Todos os anunciantes ativos em Diamantino. Clique no pin para detalhes e “Como chegar”.</p>
        </div>

        <div class="flex flex-wrap gap-2 mb-4">
            <button id="btnLocalizar" class="bg-primary text-white text-sm font-bold px-4 py-2 rounded-xl hover:bg-accent transition">
                <i class="fas fa-location-arrow mr-1"></i> Usar minha localização
            </button>
            <span id="infoLoc" class="text-sm text-gray-500 self-center"></span>
        </div>

        <div id="mapaGeral" class="bg-gray-200 shadow-md mb-6"></div>

        <div id="resultadoProxima" class="hidden mb-4 p-4 bg-blue-50 border border-blue-100 rounded-xl text-sm"></div>

        <h2 class="font-bold text-primary mb-3">Lista rápida</h2>
        <div id="listaEmpresas" class="space-y-2"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="maps-config.js"></script>
    <script src="empresas-dados.js"></script>
    <script>
        let mapa = null;
        let marcadores = [];
        let marcadorUser = null;
        let posicaoUsuario = null;

        function renderLista(empresas) {
            const box = document.getElementById('listaEmpresas');
            if (!empresas.length) {
                box.innerHTML = '<p class="text-gray-400 text-sm">Nenhuma empresa ativa no mapa ainda.</p>';
                return;
            }
            box.innerHTML = empresas.map(e => {
                const dir = EmpresasDados.linkComoChegar(e.lat, e.lng, posicaoUsuario);
                const dist = e.distanciaTexto
                    ? `<span class="text-secondary text-xs font-semibold"><i class="fas fa-location-arrow"></i> ${e.distanciaTexto}</span>`
                    : '';
                return `
                <div class="bg-white border border-gray-100 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                        <p class="font-bold text-gray-900">${e.nome || ''}</p>
                        <p class="text-xs text-gray-500">${e.endereco || ''}</p>
                        ${dist}
                    </div>
                    <div class="flex gap-2">
                        <a href="empresa.html?id=${encodeURIComponent(e.id)}" class="text-sm font-bold text-primary border border-primary/30 px-3 py-1.5 rounded-lg">Ver</a>
                        <a href="${dir}" target="_blank" rel="noopener" class="text-sm font-bold bg-primary text-white px-3 py-1.5 rounded-lg">Como chegar</a>
                    </div>
                </div>`;
            }).join('');
        }

        function montarMarcadores(empresas) {
            marcadores.forEach(m => { try { mapa.removeLayer(m); } catch (e) {} });
            marcadores = [];
            if (!mapa) return;
            var bounds = [];
            empresas.forEach(function (e) {
                if (e.lat == null || e.lng == null) return;
                var marker = L.marker([e.lat, e.lng]).addTo(mapa);
                var dir = EmpresasDados.linkComoChegar(e.lat, e.lng, posicaoUsuario);
                marker.bindPopup(
                    '<div style="min-width:160px;font-family:sans-serif">' +
                    '<strong>' + (e.nome || '') + '</strong><br>' +
                    '<span style="color:#666;font-size:12px">' + (e.endereco || '') + '</span><br>' +
                    '<a href="empresa.html?id=' + encodeURIComponent(e.id) + '" style="font-size:12px">Ver empresa</a> · ' +
                    '<a href="' + dir + '" target="_blank" style="font-size:12px">Como chegar</a></div>'
                );
                marcadores.push(marker);
                bounds.push([e.lat, e.lng]);
            });
            if (bounds.length === 1) {
                mapa.setView(bounds[0], 16);
            } else if (bounds.length > 1) {
                mapa.fitBounds(bounds, { padding: [40, 40] });
            }
        }

        function aplicarDistancias(empresas) {
            if (!posicaoUsuario) return empresas;
            return empresas.map(function (e) {
                var km = EmpresasDados.distanciaKm(posicaoUsuario.lat, posicaoUsuario.lng, e.lat, e.lng);
                var distanciaTexto = km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km';
                return Object.assign({}, e, { distanciaTexto: distanciaTexto, _km: km });
            }).sort(function (a, b) { return a._km - b._km; });
        }

        function atualizarTudo() {
            var empresas = aplicarDistancias(EmpresasDados.empresasNoMapa());
            montarMarcadores(empresas);
            renderLista(empresas);
        }

        function initMapaGeral() {
            var el = document.getElementById('mapaGeral');
            if (!el || typeof L === 'undefined') return;
            var center = (window.CD_MAPS_CENTER) || EmpresasDados.CENTER || { lat: -14.4089, lng: -56.4458 };
            mapa = L.map(el).setView([center.lat, center.lng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(mapa);
            atualizarTudo();
            setTimeout(function () { try { mapa.invalidateSize(); } catch (e) {} }, 200);
        }

        document.getElementById('btnLocalizar').addEventListener('click', function () {
            var info = document.getElementById('infoLoc');
            var res = document.getElementById('resultadoProxima');
            if (!navigator.geolocation) {
                info.textContent = 'Geolocalização não suportada.';
                return;
            }
            info.textContent = 'Obtendo localização…';
            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    posicaoUsuario = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    info.textContent = 'Localização ativada';
                    if (mapa) {
                        if (marcadorUser) try { mapa.removeLayer(marcadorUser); } catch (e) {}
                        marcadorUser = L.circleMarker([posicaoUsuario.lat, posicaoUsuario.lng], {
                            radius: 8, color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 0.9
                        }).addTo(mapa).bindPopup('Você está aqui');
                        mapa.setView([posicaoUsuario.lat, posicaoUsuario.lng], 15);
                    }
                    var empresas = aplicarDistancias(EmpresasDados.empresasNoMapa());
                    atualizarTudo();
                    if (empresas.length) {
                        res.classList.remove('hidden');
                        res.innerHTML = '<strong>Mais perto de você:</strong> ' + empresas[0].nome + ' (' + empresas[0].distanciaTexto + ')';
                    }
                },
                function () { info.textContent = 'Não foi possível obter o GPS.'; },
                { enableHighAccuracy: true, timeout: 15000 }
            );
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMapaGeral);
        } else {
            initMapaGeral();
        }
    </script>
    <script src="auth-utils.js"></script>
    <script src="install-app.js"></script>
</body>
</html>
