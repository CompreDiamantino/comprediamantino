<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>Área do Anunciante — Compre Diamantino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2A6B',
                        secondary: '#F5C518',
                        accent: '#0D3B8C'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <img src="icon-192.png" alt="Compre Diamantino" class="w-16 h-16 mx-auto rounded-full mb-3">
            <h1 class="text-2xl font-bold text-primary">Área do Anunciante</h1>
            <p class="text-gray-500 text-sm mt-1">Gerencie seu negócio, perfil e promoções</p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-8">
            <form id="formLogin" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail ou Telefone</label>
                    <input type="text" id="identificador" required
                        list="listaUltimosLogins" autocomplete="username" name="username"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
                        placeholder="seu@email.com ou telefone">
                    <div id="chipsUltimosLogins" class="flex flex-wrap gap-2 mt-2"></div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <div class="relative">
                        <input type="password" id="senha" required
                            name="password" autocomplete="current-password"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 pr-12 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
                            placeholder="Digite ou cole a senha">
                        <button type="button" id="btnOlho" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-primary text-white font-bold py-3.5 rounded-xl hover:bg-accent transition">
                    Entrar
                </button>
            </form>
            
            <datalist id="listaUltimosLogins"></datalist>
            
            <div id="msgErro" class="hidden mt-4 text-center text-red-600 text-sm font-medium"></div>
            
            <div class="mt-5 text-center text-sm">
                <a href="recuperar-senha.html" class="text-primary font-semibold hover:underline">
                    Esqueci minha senha
                </a>
            </div>
            
            <div class="mt-4 text-center text-sm text-gray-500">
                <p>Ainda não tem acesso?</p>
                <a href="anuncie-acesso.html" class="text-primary font-semibold hover:underline">
                    Cadastrar meu negócio
                </a>
            </div>
        </div>
        
        <p class="text-center text-xs text-gray-400 mt-6">
            <a href="index.html" class="hover:text-primary">← Voltar ao site</a>
        </p>
    </div>

    <script src="auth-utils.js"></script>
    <script>
        
        // Se gestor já logado, vai pro hub (não pede senha de novo)
        (function() {
            try {
                const g = AuthUtils.getGestorSession && AuthUtils.getGestorSession();
                if (g && g.logado) {
                    window.location.href = 'gestor-hub.html';
                    return;
                }
                const lj = JSON.parse(localStorage.getItem('cd_lojista') || 'null');
                if (lj && lj.empresaId && !lj.viaGestor) {
                    window.location.href = 'lojista-painel.html';
                }
            } catch (_) {}
        })();

        AuthUtils.preencherUltimosLogins('identificador', 'chipsUltimosLogins', 'listaUltimosLogins');
        AuthUtils.setupToggleSenha('senha', 'btnOlho');
        
        document.getElementById('formLogin').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const id = document.getElementById('identificador').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const msg = document.getElementById('msgErro');
            msg.classList.add('hidden');
            const idNorm = AuthUtils.normalizarIdentificador(id);
            const idLower = id.toLowerCase();
            
            // ——— GESTOR MASTER (acesso total) → hub do gestor ———
            // Senhas oficiais IBN (também listadas em auth-utils.js)
            const SENHAS_GESTOR = ['IbnDiamantino@2026', 'IBN-Gestor-2026!'];
            const ehGestor = (typeof AuthUtils !== 'undefined' && AuthUtils.senhaGestorValida)
                ? AuthUtils.senhaGestorValida(senha)
                : SENHAS_GESTOR.includes(senha);
            
            if (ehGestor) {
                if (typeof AuthUtils !== 'undefined' && AuthUtils.loginGestor) {
                    AuthUtils.loginGestor(id || 'gestor');
                } else {
                    localStorage.setItem('cd_gestor', JSON.stringify({
                        tipo: 'gestor', nivel: 'gestor', master: true, logado: true,
                        bloqueado: false, usuario: id || 'gestor',
                        logadoEm: new Date().toISOString(), ultimaAtividade: Date.now()
                    }));
                    localStorage.setItem('cd_admin', JSON.stringify({
                        logado: true, viaGestor: true, nivel: 'gestor',
                        logadoEm: new Date().toISOString()
                    }));
                }
                window.location.href = 'gestor-hub.html';
                return;
            }
            
            // ——— LOJISTA: busca por e-mail OU telefone + senha cadastrada ———
            const lojistaCad = AuthUtils.buscarLojistaPorIdentificador(id);
            if (lojistaCad && AuthUtils.validarSenhaLojista(lojistaCad, senha)) {
                AuthUtils.salvarUltimoLogin(id);
                localStorage.setItem('cd_lojista', JSON.stringify({
                    email: lojistaCad.email || (id.includes('@') ? id : ''),
                    telefone: AuthUtils.normalizarIdentificador(lojistaCad.whatsapp || (!id.includes('@') ? id : '')),
                    identificador: id,
                    nome: lojistaCad.nome || lojistaCad.responsavel || 'Lojista',
                    empresaId: lojistaCad.id,
                    plano: lojistaCad.plano || 'basico',
                    status: lojistaCad.status || 'pendente',
                    logadoEm: new Date().toISOString()
                }));
                window.location.href = 'lojista-painel.html';
                return;
            }
            
            // ——— SENHA TEMPORÁRIA (recuperação de senha) ———
            const chaveTemp = 'cd_temp_login_' + idNorm;
            const senhaTemp = localStorage.getItem(chaveTemp);
            if (senhaTemp && senha === senhaTemp) {
                // Tenta achar lojista real; se achar, usa os dados dele
                const ljTemp = AuthUtils.buscarLojistaPorIdentificador(id);
                AuthUtils.salvarUltimoLogin(id);
                localStorage.setItem('cd_lojista', JSON.stringify({
                    email: (ljTemp && ljTemp.email) || (id.includes('@') ? id : ''),
                    telefone: (ljTemp && AuthUtils.normalizarIdentificador(ljTemp.whatsapp || '')) || (!id.includes('@') ? idNorm : ''),
                    identificador: id,
                    nome: (ljTemp && (ljTemp.nome || ljTemp.responsavel)) || 'Lojista',
                    empresaId: (ljTemp && ljTemp.id) || '',
                    plano: (ljTemp && ljTemp.plano) || 'basico',
                    status: (ljTemp && ljTemp.status) || 'pendente',
                    logadoEm: new Date().toISOString()
                }));
                window.location.href = 'lojista-painel.html';
                return;
            }
            
            msg.textContent = 'E-mail/telefone ou senha incorretos.';
            msg.classList.remove('hidden');
        });
    </script>
</body>
</html>
