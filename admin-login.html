<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>Admin — Compre Diamantino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2A6B',
                        secondary: '#F5C518',
                        accent: '#0D3B8C'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <img src="icon-192.png" alt="Logo" class="w-14 h-14 mx-auto rounded-full mb-3">
            <h1 class="text-xl font-bold text-white">Painel de Gestão</h1>
            <p class="text-gray-400 text-sm">Compre Diamantino</p>
        </div>

        <div class="bg-gray-800 rounded-2xl p-6 shadow-xl">
            <form id="formAdminLogin" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Usuário</label>
                    <input type="text" id="usuario" required
                        list="listaUltimosLogins" autocomplete="username"
                        class="w-full bg-gray-700 border border-gray-600 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-secondary"
                        placeholder="admin" value="admin">
                    <div id="chipsUltimosLogins" class="flex flex-wrap gap-2 mt-2"></div>
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Senha de administrador</label>
                    <div class="relative">
                        <input type="password" id="senhaAdmin" required
                            class="w-full bg-gray-700 border border-gray-600 text-white rounded-xl px-4 py-3 pr-12 focus:outline-none focus:border-secondary"
                            placeholder="••••••••">
                        <button type="button" id="btnOlho" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-secondary text-primary font-bold py-3 rounded-xl hover:bg-yellow-400 transition">
                    Entrar
                </button>
            </form>
            <datalist id="listaUltimosLogins"></datalist>
            <div id="msgErro" class="hidden mt-3 text-center text-red-400 text-sm"></div>
            
            <div class="mt-4 text-center text-sm">
                <a href="recuperar-senha.html" class="text-secondary hover:underline">Esqueci minha senha</a>
            </div>
        </div>
        
        <p class="text-center text-xs text-gray-500 mt-6">
            <a href="gestor-login.html" class="hover:text-secondary">Acesso Gestor</a>
            ·
            <a href="index.html" class="hover:text-secondary">Voltar ao site</a>
        </p>
    </div>

    <script src="auth-utils.js"></script>
    <script>
        AuthUtils.preencherUltimosLogins('usuario', 'chipsUltimosLogins', 'listaUltimosLogins');
        AuthUtils.setupToggleSenha('senhaAdmin', 'btnOlho');
        
        document.getElementById('formAdminLogin').addEventListener('submit', (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senhaAdmin').value;
            const msg = document.getElementById('msgErro');
            
            if (senha === 'admin123') {
                AuthUtils.salvarUltimoLogin(usuario || 'admin');
                
                localStorage.setItem('cd_admin', JSON.stringify({
                    logado: true,
                    usuario: usuario || 'admin',
                    logadoEm: new Date().toISOString()
                }));
                window.location.href = 'admin-painel.html';
            } else {
                msg.textContent = 'Senha incorreta. Use: admin123 (demo)';
                msg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
